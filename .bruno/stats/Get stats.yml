info:
  name: Get statistics
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/stats"
  params:
    - name: granularity
      value: daily
      type: query
    - name: timezone
      value: UTC
      type: query
    - name: tools
      value: summary
      type: query
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
